services:
  postgres:
    image: postgres:16-alpine
    # Long-running daemon: a process that exits should come back.
    # `unless-stopped` rather than `always` so a deliberate
    # `docker compose stop` sticks across a host reboot.
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Long-running daemon: a process that exits should come back.
    # `unless-stopped` rather than `always` so a deliberate
    # `docker compose stop` sticks across a host reboot.
    restart: unless-stopped
    # Account halts (`halt:*`) and the blueprint §58 kill switch live only
    # in Redis, and both are controls that must stay engaged until a human
    # deliberately lifts them. With no volume and no persistence the
    # default image keeps them in the container's ephemeral layer, so
    # recreating this container silently resumed every halted account --
    # without the audit row and notification that
    # `POST /admin/accounts/{id}/resume` writes. AOF, plus a named volume
    # alongside the one `postgres` already has.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
    command: ["alembic", "upgrade", "head"]
    # Deliberately NO `restart:` policy. This is a one-shot job that the
    # api and worker wait on via `service_completed_successfully`; a
    # restart policy would turn a failed migration into a restart loop
    # and never let either of them start.
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    # Long-running daemon: a process that exits should come back.
    # `unless-stopped` rather than `always` so a deliberate
    # `docker compose stop` sticks across a host reboot.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.main"]
    # Long-running daemon: a process that exits should come back.
    # `unless-stopped` rather than `always` so a deliberate
    # `docker compose stop` sticks across a host reboot.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
